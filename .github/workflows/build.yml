name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release assets on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            firmware/.pio/libdeps
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install tools
        run: |
          pip install platformio
          sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Bridge tests
        run: python -m unittest host/test_agenttally.py
      - name: Simulator builds
        run: cd firmware && pio run -e sim
      - name: Firmware for every board
        run: tools/build_firmware.sh
      - name: Site
        run: tools/build_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            web/firmware/*.bin
            enclosure/stl/*.stl

  pages:
    # GitHub Pages needs a public repository on free plans
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
