; AgentTally firmware
;
;   pio run -e cyd28 -t upload      ESP32-2432S028R, micro-USB and dual-USB (CYD2USB); panel auto-detected
;   pio run -e sim -t exec          desktop simulator (SDL2), connects to the bridge on 127.0.0.1:47322
;
[platformio]
default_envs = cyd28

[esp32]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
board_build.f_flash = 40000000L
monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  bblanchon/ArduinoJson@7.2.1
build_flags = -O2 -DCORE_DEBUG_LEVEL=0 -DAT_FW_VERSION=\"0.1.0\"
build_src_filter = +<*> -<platform/sim.cpp>

[env:cyd28]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD28

[env:cyd24r]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD24R

[env:cyd24c]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD24C

[env:cyd32r]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD32R

[env:cyd32c]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD32C

[env:cyd35r]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD35R

[env:cyd35c]
extends = esp32
build_flags = ${esp32.build_flags} -DAT_BOARD_CYD35C

; Desktop simulator. Needs SDL2 (brew install sdl2 / apt install libsdl2-dev).
; Pick the screen with SIM_W/SIM_H, e.g. -DSIM_W=320 -DSIM_H=480 for the 3.5" layout.
[env:sim]
platform = native
lib_deps =
  lovyan03/LovyanGFX@1.2.7
  bblanchon/ArduinoJson@7.2.1
lib_compat_mode = off
build_flags = -std=c++17 -O2 -DAT_SIM -DAT_FW_VERSION=\"0.1.0\" -DSIM_W=240 -DSIM_H=320
  -I/opt/homebrew/include -I/opt/homebrew/include/SDL2 -I/usr/local/include/SDL2 -I/usr/include/SDL2
  -L/opt/homebrew/lib -L/usr/local/lib -lSDL2 -lpthread
build_src_filter = +<*> -<platform/esp32.cpp>
